<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Sign Up Domiciliario - Empanadas El Maizal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="{{ url_for('static', filename='img/icono log domi.png') }}">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo registro domiciliario.css') }}">
</head>
<body>
  <header>
    <div class="logo">
      <a href="{{ url_for('home') }}">
        <img src="{{ url_for('static', filename='img/logo_tranparente.png') }}" class="logo" alt="Logo Empanadas El Maizal">
      </a>
    </div>
  </header>
  
  <div class="formulario">
    <h1>Sign Up Domiciliario</h1>
    <form id="registroForm" method="post">
      <div class="campo">
        <label for="Cedula">Cédula de Ciudadanía:</label>
        <div class="input-container">
          <i class="fas fa-id-card input-icon"></i>
          <input type="number" name="cedula" id="cedula" placeholder="Cédula de Ciudadanía" required min="0" step="1" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
        </div>
      </div>

      <div class="campo">
        <label for="nombre">Nombres Completos</label>
        <div class="input-container">
          <i class="fas fa-user input-icon"></i>
          <input type="text" id="nombre" name="nombre" placeholder="Nombres Completos" required autocomplete="name">
        </div>
      </div>

      <div class="campo">
        <label for="telefono">Número de Teléfono</label>
        <div class="input-container">
          <i class="fas fa-phone input-icon"></i>
          <input type="tel" id="telefono" name="telefono" placeholder="Teléfono" required autocomplete="tel">
        </div>
      </div>

      <div class="campo">
        <label for="email">Correo Electrónico</label>
        <div class="input-container">
          <i class="fas fa-envelope input-icon"></i>
          <input type="email" id="email" name="email" placeholder="Correo Electrónico" required autocomplete="email">
        </div>
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <div class="input-container">
          <i class="fas fa-lock input-icon"></i>
          <input type="password" id="password" name="password" placeholder="Contraseña" required autocomplete="new-password">
          <i class="fas fa-eye password-toggle" onclick="togglePassword('password')"></i>
        </div>
      </div>

      <input type="submit" value="Registrarse">
    </form>
  </div>

  <script src="{{ url_for('static', filename='js/Sing up Domiciliario.js') }}"></script>
</body>
</html>
