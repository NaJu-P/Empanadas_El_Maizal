<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Login Domiciliario - Empanadas El Maizal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo login dom.css') }}" />
  <link rel="icon" href="{{ url_for('static', filename='img/icono log domi.png') }}">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
  <header>
    <div class="logo">
      <a href="{{ url_for('home') }}">
          <img src="{{ url_for('static', filename='img/logo_tranparente.png') }}" class="logo" alt="Logo Empanadas El Maizal">
      </a>
    </div>
  </header>
  <div class="formulario">
    <h1>Login Domiciliario</h1>
    <form id="loginForm" method="post">
      
      <div class="campo email">
        <label for="email">Correo Electrónico</label><br>
        <i class="fas fa-envelope icono"></i>
        <input type="email" id="email" name="email" placeholder="Correo Electrónico" required autocomplete="email">
      </div>
      
      <div class="campo password" style="position: relative;">
        <label for="password">Contraseña</label><br>
        <i class="fas fa-lock icono"></i>
        <input type="password" id="password" name="password" placeholder="Contraseña" required autocomplete="current-password">
        <i class="input-icon password-toggle fas fa-eye" onclick="togglePassword('password')"></i>
      </div>

      <input type="submit" value="Iniciar Sesión">
    </form>
  </div>
  <script src="{{ url_for('static', filename='js/login dom.js') }}"></script>
</body>
</html>
